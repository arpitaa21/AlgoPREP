# Used by tests only (activated with @ActiveProfiles("test")).
# H2 in MySQL compatibility mode: no MySQL server needed to run `mvn test`.
spring.datasource.url=jdbc:h2:mem:placement_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-test-secret-test-secret-123456
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173
app.test.grace-seconds=10

# Tests create their own data; only the admin account is seeded.
app.seed.admin-enabled=true
app.seed.admin-email=admin@test.local
app.seed.admin-password=Admin@123
app.seed.sample-data=false

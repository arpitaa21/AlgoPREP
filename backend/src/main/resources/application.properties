spring.application.name=placement-portal
server.port=8080

# ---------- Database (override with environment variables in real deployments) ----------
# createDatabaseIfNotExist=true lets MySQL create the schema on first run (dev convenience).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA / Hibernate ----------
# update : Hibernate creates/alters tables from the entities (easy for development).
# none   : Hibernate touches nothing; you run db/schema.sql yourself (recommended for production).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Pitfall: open-in-view keeps a DB session open during JSON rendering and hides lazy-loading bugs.
# We turn it off and map entities to DTOs inside @Transactional service methods instead.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# N+1 safety net: when lazy collections / proxies must be loaded, Hibernate loads up to 50 of them
# in ONE "where id in (...)" query instead of one query each.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Store all timestamps in UTC so the app behaves the same on any server.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JWT ----------
# The secret MUST be at least 32 characters for HS256. Always override it with an env var in production.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-use-32-plus-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---------- CORS (the React dev server origin) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- Timed tests ----------
# Extra seconds allowed after the deadline to absorb network latency on submit.
app.test.grace-seconds=10

# ---------- Seed data ----------
app.seed.admin-enabled=true
app.seed.admin-email=${ADMIN_EMAIL:admin@placement.local}
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}
app.seed.sample-data=true
